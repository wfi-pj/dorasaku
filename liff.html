<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>読込中...</title>
    <style>
        /* ユーザーを待たせる間の一時的なローディング画面 */
        body { display: flex; justify-content: center; align-items: center; height: 100vh; font-family: sans-serif; background-color: #f7f9fa; color: #333; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #00b900; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .container { text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <div class="loader"></div>
        <p>ページを移動しています。そのままお待ちください...</p>
    </div>

    <!-- LINE LIFF SDK の読み込み -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        // 1. LIFFの初期化
        liff.init({
            liffId: "2010681134-jdxkPIXw" // 発行されたLIFF ID
        })
        .then(() => {
            // ログインしていない場合は強制ログイン（0タップ動線の肝）
            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }

            // 2. LINEユーザープロファイル情報の取得
            liff.getProfile()
            .then(profile => {
                const lineUserId = profile.userId;

                // 3. URLから紹介元コード（ref）を抽出
                const urlParams = new URLSearchParams(window.location.search);
                const refCode = urlParams.get('ref') || ""; // なければ空文字（一般流入対策）

                // 4. MakeのWebhookへデータを送信
                // ※【重要】MakeでWebhookを作成後、下記のURLを差し替えます
                const makeWebhookUrl = "https://hook.us2.make.com/u7oyinn5xg38cenwfyw5r7he8kfa2y6r";

                fetch(makeWebhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        lineUserId: lineUserId,
                        refCode: refCode
                    })
                })
                .then(() => {
                    // 5. 送信完了後、採用サイト（表舞台）へ自動リダイレクト
                    window.location.href = "https://recruit.ke-ban.com/";
                })
                .catch((error) => {
                    console.error("Makeへの送信エラー:", error);
                    // エラーが起きてもユーザーを止めないよう、採用サイトへ逃がす
                    window.location.href = "https://recruit.ke-ban.com/";
                });
            });
        })
        .catch((err) => {
            console.error("LIFF初期化エラー:", err);
            // 万が一の初期化エラー時も採用サイトへリダイレクト
            window.location.href = "https://recruit.ke-ban.com/";
        });
    </script>
</body>
</html>
